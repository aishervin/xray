name: Update VLESS subscription

on:
  schedule:
    - cron: "0 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-vless-subscription
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run tests
        run: python -m unittest discover -s tests -v

      - name: Collect and test public VLESS nodes
        run: python collector.py
        env:
          TCP_TIMEOUT: "3.5"
          TCP_WORKERS: "64"
          MAX_CONFIGS: "50000"

      - name: Commit updated subscription
        run: |
          if git diff --quiet -- vless.txt; then
            echo "No subscription changes to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add vless.txt
          git commit -m "Update live VLESS subscription"
          for attempt in 1 2 3 4 5; do
            git fetch origin main
            if ! git rebase origin/main; then
              git rebase --abort || true
              echo "Rebase conflict; leaving the remote vless.txt unchanged."
              exit 1
            fi
            if git push origin HEAD:main; then
              exit 0
            fi
            echo "Remote changed during push; retrying ($attempt/5)."
            sleep "$((attempt * 2))"
          done
          echo "Could not push after five retries."
          exit 1
